# Cross-compiles and publishes release assets, named to match what the
# generated `update` command looks for. Triggered by a VERSION change so a
# release is deliberate - but tests run on every push and PR, or a CLI repo
# would only ever be tested at release time.
name: {{ .Name }}

on:
  push:
    branches: [main]{{ if .PathFilter }}
    paths: ['{{ .PathFilter }}/**', '.github/workflows/{{ .Name }}.yaml']{{ end }}
  pull_request:{{ if .PathFilter }}
    paths: ['{{ .PathFilter }}/**']{{ end }}
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read{{ if .PathFilter }}
    # Everything below runs in the service directory: in a monorepo the
    # CLI's go.mod is not at the repo root, and `go test ./...` from the
    # root either finds nothing or tests a sibling service.
    defaults:
      run:
        working-directory: {{ .PathFilter }}{{ end }}
    steps:
      - uses: actions/checkout@v4
{{ .BuildSteps }}
  release:
    # Only when VERSION changed, and only from main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # grep -qx against the full path. A bare `VERSION` never matches
      # in a monorepo, where the file is services/<name>/VERSION - so the
      # gate stayed closed forever and no release could be cut, silently,
      # because a gate that does not open looks the same as a commit that
      # did not bump the version.
      - name: Release only on a VERSION change
        id: gate
        run: |
          # A manual run always releases: that is what the trigger is for.
          # The shell env var, not a GitHub expression: this file is itself
          # a Go template, which would try to evaluate the braces.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            go=true
          # A repo's FIRST commit has no parent, so HEAD~1 does not resolve and
          # git diff fails - which read as "VERSION did not change" and left a
          # freshly scaffolded repo unable to release until some later commit
          # happened to touch the file. That first commit is the one that
          # introduces VERSION, so it always qualifies.
          elif ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            go=true
          elif git diff --name-only HEAD~1 HEAD | grep -qx '{{ if .PathFilter }}{{ .PathFilter }}/{{ end }}VERSION'; then
            go=true
          else
            go=false
          fi
          echo "go=$go" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}go.mod
          cache: true
          cache-dependency-path: {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}go.sum

      - name: Read version
        if: steps.gate.outputs.go == 'true'
        id: v
        run: echo "version=$(head -n1 {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}VERSION)" >> $GITHUB_OUTPUT

      # Asset names must match what `{{ .Name }} update` looks for:
      # {{ .Name }}_<goos>_<goarch>.tar.gz containing the bare binary.
      # Version is injected here; without it a released binary reports
      # "dev" and refuses to update itself.
      - name: Cross-compile
        if: steps.gate.outputs.go == 'true'{{ if .PathFilter }}
        working-directory: {{ .PathFilter }}{{ end }}
        run: |
          VERSION="${{ "{{" }} steps.v.outputs.version {{ "}}" }}"
          LDFLAGS="-s -w -X main.Version=$VERSION"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            mkdir -p "dist/$GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/$GOOS/$GOARCH/{{ .Name }}" .
            tar -czf "{{ .Name }}_${GOOS}_${GOARCH}.tar.gz" -C "dist/$GOOS/$GOARCH" "{{ .Name }}"
          done
          sha256sum {{ .Name }}_*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == 'true'
        with:
          # Prefixed in a monorepo, because releases are per REPOSITORY
          # and the siblings each cut their own. Sharing one namespace
          # made `latest` mean "whichever service released last", and
          # two services reaching the same number attached their assets
          # to ONE release where the second checksums.txt overwrote the
          # first. A dedicated repo has one release line, so no prefix.
          tag_name: {{ if .PathFilter }}{{ .Name }}/{{ end }}${{ "{{" }} steps.v.outputs.version {{ "}}" }}
          files: |
            {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}{{ .Name }}_*.tar.gz
            {{ if .PathFilter }}{{ .PathFilter }}/{{ end }}checksums.txt
