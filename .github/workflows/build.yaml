# Cross-compiles and publishes release assets, named to match what the
# generated `update` command looks for. Triggered by a VERSION change so a
# release is deliberate - but tests run on every push and PR, or a CLI repo
# would only ever be tested at release time.
name: homelabctl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # make test, not the commands themselves: the Makefile says it
      # runs "what CI runs", and that is only true if this IS it. This
      # repo generates that Makefile for every other service, so it is
      # the last place that should be running its own private copy of
      # the commands.
      - name: Test
        run: make test

  release:
    # Only when VERSION changed, and only from main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # grep -qx against the full path. A bare `VERSION` never matches
      # in a monorepo, where the file is services/<name>/VERSION - so the
      # gate stayed closed forever and no release could be cut, silently,
      # because a gate that does not open looks the same as a commit that
      # did not bump the version.
      # Ask GitHub whether this version is already released, instead of
      # predicting from git history whether it ought to be. The old gate
      # could not open on a first commit (HEAD~1 does not resolve) or on a
      # workflow_dispatch run, and both failed silently - a gate that does
      # not open looks exactly like a commit that did not bump the version.
      # This is how Clever's wag does it: attempt the release, treat
      # "already exists" as success.
      - name: Release unless this version is already published
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(head -n1 VERSION)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release already exists for $version"
            go=false
          else
            echo "no release for $version yet"
            go=true
          fi
          echo "go=$go" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Asset names must match what `homelabctl update` looks for:
      # homelabctl_<goos>_<goarch>.tar.gz containing the bare binary.
      # Version is injected here; without it a released binary reports
      # "dev" and refuses to update itself.
      - name: Cross-compile
        if: steps.gate.outputs.go == 'true'
        run: |
          VERSION="${{ steps.gate.outputs.version }}"
          LDFLAGS="-s -w -X main.Version=$VERSION"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            mkdir -p "dist/$GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/$GOOS/$GOARCH/homelabctl" .
            tar -czf "homelabctl_${GOOS}_${GOARCH}.tar.gz" -C "dist/$GOOS/$GOARCH" "homelabctl"
          done
          sha256sum homelabctl_*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == 'true'
        with:
          tag_name: ${{ steps.gate.outputs.version }}
          files: |
            homelabctl_*.tar.gz
            checksums.txt
